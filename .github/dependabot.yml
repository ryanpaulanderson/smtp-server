version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      development-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns:
          - openpgp
          - nodemailer
          - smtp-server
          - jose
          - mcp-handler
          - "@modelcontextprotocol/*"
          - "@descope/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
  - package-ecosystem: docker
    directory: /
    # Node upgrades must match package.json and the production runtime.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
