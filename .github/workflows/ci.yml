name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-coverage-test-output
          path: coverage
          retention-days: 7
          if-no-files-found: warn

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_COMPOSE_PROJECT: email-mcp-ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned dependencies and actual production image
        run: pnpm test:integration prepare
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          version: v0.75.0
          image-ref: ${{ env.TEST_COMPOSE_PROJECT }}-production
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          output: image-scan.txt
      - name: Test the scanned image without network pulls or rebuilding
        run: pnpm test:integration run
      - name: Remove only this run's disposable resources
        if: always()
        run:
          docker compose --project-name "$TEST_COMPOSE_PROJECT" --env-file /dev/null -f
          compose.yaml down --volumes --remove-orphans --timeout 5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-scan-test-output
          path: image-scan.txt
          retention-days: 7
          if-no-files-found: warn

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:dependencies
      - name: Review public pull-request dependency changes
        if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
      - name: Record unavailable optional private-repository review
        if: ${{ github.event_name == 'pull_request' && github.event.repository.private }}
        run:
          echo 'Optional dependency review is not assumed available for private
          repositories; the complete pnpm audit remains required.' >>
          "$GITHUB_STEP_SUMMARY"

  required:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [quality, unit, integration, dependency-audit]
    if: always()
    steps:
      - name: Require every validation job to succeed
        env:
          QUALITY: ${{ needs.quality.result }}
          UNIT: ${{ needs.unit.result }}
          INTEGRATION: ${{ needs.integration.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
        run: |
          for result in "$QUALITY" "$UNIT" "$INTEGRATION" "$DEPENDENCY_AUDIT"; do
            if [ "$result" != success ]; then
              echo "A required validation job did not succeed: $result"
              exit 1
            fi
          done
